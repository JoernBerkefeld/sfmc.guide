# Build and deploy the Jekyll site to GitHub Pages using the repo's own Gemfile
# (Jekyll 4.3 + modern Dart Sass), instead of the legacy `github-pages` gem
# (Jekyll 3.10 + Ruby Sass 3.7) that does not support `@use` module syntax.
#
# Custom domain (sfmc.guide): always build with empty baseurl. Do NOT pass
# configure-pages base_path — for this repo that can resolve to "/sfmc.guide"
# and break every asset/link on the apex domain.
name: Deploy Jekyll site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl ""
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4