<header class="site-header">
  <div class="header-inner">
    <div class="header-brand">
      <a href="{{ '/' | relative_url }}" class="brand-link">
        <span class="brand-icon">
          <img src="{{ '/assets/sfmc-guide-compass.svg' | relative_url | cache_bust }}" width="28" height="28" alt="" aria-hidden="true">
        </span>
        <span class="brand-name">sfmc<span class="brand-dot">.</span>guide</span>
      </a>
      {% include brand-platforms.html %}
    </div>

    <div class="header-search">
      <div class="search-wrapper">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <circle cx="6.5" cy="6.5" r="5" stroke="currentColor" stroke-width="1.5"/>
          <path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <input type="text" id="search-input" class="search-input" placeholder="Search guides, tools…" autocomplete="off" spellcheck="false">
        <kbd class="search-kbd">⌘K</kbd>
        <button class="search-cancel" type="button" aria-label="Cancel search">Cancel</button>
      </div>
      <div id="search-results" class="search-results" hidden></div>
    </div>

    <nav class="header-nav">
      {%- comment -%}
        No Engagement / Next links here — the brand platform toggles on the left
        already cover both, and duplicating them crowds the bar.
      {%- endcomment -%}
      <a href="{{ '/tools/' | relative_url }}" class="header-nav-link">Tools</a>
      <a href="https://ssjs.guide" class="header-nav-link" target="_blank" rel="noopener">ssjs.guide</a>
    </nav>

    <button class="mobile-menu-toggle" id="mobile-menu-toggle" aria-label="Toggle navigation" aria-expanded="false">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <path d="M2 5h16M2 10h16M2 15h16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </button>
  </div>
</header>
