- name: "Now"
  url: "/next/ampscript/functions/now/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud-ampscript/references/mc-ampscript-date-time/mc-ampscript-reference-date-time-now.html"
  tagline: "The documented optional argument is rejected: any Now(...) with an argument cannot be saved"
  category: "Date and Time"
  object: "Date and Time"
  severity: "high"
  discrepancy: "A3"
  anchor: "now-argument-rejected"
  body: |
    The reference documents one optional boolean argument that switches between the current time and the email send time, with `Now(true)` in its comparison table.

    In Next (2026-11-23), an email containing `Now(1)`, `Now(true)`, `Now(false)`, `Now("1")`, `Now("true")` or any other single argument could not be saved: the content API answered HTTP 400 with "The AMPscript syntax isn't valid", pointing at the call. Only `Now()` without arguments is accepted.
  testScript: |
    %%=Now(true)=%%

- name: "Output"
  url: "/next/ampscript/functions/output/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud-ampscript/references/mc-ampscript-utilities/mc-ampscript-reference-utilities-output.html"
  tagline: "The function-call argument the docs require is rejected, and other arguments render nothing"
  category: "Utility"
  object: "Utility"
  severity: "high"
  discrepancy: "A3"
  anchor: "output-function-argument-rejected"
  body: |
    The reference lists `Output` as available in Marketing Cloud Next, requires the argument to be a function call, and says any other kind of value raises an error.

    In a Marketing Cloud Next email it is the other way round:

    - An email containing `Output(Concat("x"))` cannot be saved: the content API answers HTTP 400 with "The AMPscript syntax isn't valid", even when the call sits in an `IF` branch that never runs. Two nested calls as arguments are rejected the same way.
    - `Output("bare")`, `Output(@word)` and `Output(123)` save and render, but write nothing and raise no error.

    In a Next email `Output` cannot write anything; use `v()` inline instead.
  testScript: |
    %%[ Output("bare") ]%%

- name: "OutputLine"
  url: "/next/ampscript/functions/outputline/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud-ampscript/references/mc-ampscript-utilities/mc-ampscript-reference-utilities-output-line.html"
  tagline: "The function-call argument the docs require is rejected; other arguments write only a line break"
  category: "Utility"
  object: "Utility"
  severity: "high"
  discrepancy: "A3"
  anchor: "outputline-function-argument-rejected"
  body: |
    The reference lists `OutputLine` as available in Marketing Cloud Next, requires the argument to be a function call, and says a CRLF line break follows the result.

    In a Marketing Cloud Next email:

    - An email containing `OutputLine(Concat("A"))` cannot be saved: the content API answers HTTP 400 with "The AMPscript syntax isn't valid". Two or three nested calls as arguments, and two such calls in a row, are rejected the same way.
    - `OutputLine("bare")`, `OutputLine(@word)` and `OutputLine(456)` save, but write only a bare line feed (no carriage return) and none of the value.

    To write a value into a Next email, use `v()` inline instead.
  testScript: |
    %%[ OutputLine("bare") ]%%

- name: "ProperCase"
  url: "/next/ampscript/functions/propercase/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud-ampscript/references/mc-ampscript-string/mc-ampscript-reference-string-propercase.html"
  tagline: "Only a space starts a new word; hyphens and apostrophes do not"
  category: "String"
  object: "String"
  severity: "medium"
  discrepancy: "A5"
  anchor: "propercase-only-spaces-start-words"
  body: |
    The official page says the first letter of every word is raised to upper case, without saying what separates words. In Next only a space does: `ProperCase("o'neill mcdonald-smith")` gives `O'neill Mcdonald-smith`, and `ProperCase("a.b,c")` gives `A.b,c`. Letters after a digit stay lower case too (`ProperCase("abc3def")` gives `Abc3def`).

    Names with an apostrophe or a hyphen come out with the second part in lower case.
  testScript: |
    %%=ProperCase("o'neill mcdonald-smith")=%%

- name: "ProperCase"
  url: "/next/ampscript/functions/propercase/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud-ampscript/references/mc-ampscript-string/mc-ampscript-reference-string-propercase.html"
  tagline: "A leading ß becomes SS and the result grows by one character"
  category: "String"
  object: "String"
  severity: "low"
  discrepancy: "A5"
  anchor: "propercase-sharp-s-expands"
  body: |
    The docs do not mention characters whose capital form is longer. In Next, a word starting with `ß` gets `SS`: `ProperCase(Concat(Char(223), "trasse"))` gives `SStrasse`, and `Length` of the result is `8` where the input measured `7`.
  testScript: |
    %%=ProperCase(Concat(Char(223), "trasse"))=%%

- name: "Random"
  url: "/next/ampscript/functions/random/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud-ampscript/references/mc-ampscript-utilities/mc-ampscript-reference-utilities-random.html"
  tagline: "Decimal bounds can return a whole number outside the range"
  category: "Math"
  object: "Math"
  severity: "medium"
  discrepancy: "A7"
  anchor: "random-decimal-bounds-outside-range"
  body: |
    The official reference allows decimal bounds and says the result is never below the lower bound or above the upper bound.

    In a Marketing Cloud Next email, `Random(1.2, 1.8)` rendered `1`, which lies below the lower bound. Results are whole numbers, so decimal bounds are rounded in some way first. Each decimal case was a single sample, so the exact rounding rule was not established.
  testScript: |
    %%=Random(1.2,1.8)=%%

- name: "Random"
  url: "/next/ampscript/functions/random/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud-ampscript/references/mc-ampscript-utilities/mc-ampscript-reference-utilities-random.html"
  tagline: "Reversed bounds break the email preview"
