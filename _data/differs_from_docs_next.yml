- name: "Field"
  url: "/next/ampscript/functions/field/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud-ampscript/references/mc-ampscript-data-extension/mc-ampscript-reference-data-extension-field.html"
  tagline: "The not-found flag neither yields an empty string nor raises an error for a missing column"
  category: "Data Extension"
  object: "Data Extension"
  severity: "high"
  discrepancy: "A7"
  anchor: "field-flag-not-honoured"
  body: |
    The reference says the third argument controls a missing column: a falsy value gives an empty string, a truthy value (the default when the argument is left out) raises an error.

    In a Marketing Cloud Next email:

    - On a `BuildRowSetFromString("a,b,c", ",")` row, `Field(@row, "NoSuchColumn", flag)` rendered `false` for `false`, `0`, `"false"`, `"0"`, `"1"` and `"notabool"`, and `true` for `true`, `1` and `"true"`. None of these returned an empty string and none failed.
    - On a `BuildRowsetFromJSON` row, the two-argument call on a column that is not there (`Field(row, "NoSuchColumn")`, and `Field(row, "dest")` where the key is `Dest`) rendered an empty string instead of failing.
    - Only the two-argument call on a missing column of a `BuildRowSetFromString` row failed (HTTP 500), as described.

    Code that relies on the flag to get an empty string, or to stop on a typo in a column name, does neither in Next.
  testScript: |
    %%[
      SET @rs = BuildRowSetFromString("a,b,c", ",")
      SET @row = Row(@rs, 1)
      SET @v = Field(@row, "NoSuchColumn", 0)
    ]%%
    [%%=v(@v)=%%]

- name: "Field"
  url: "/next/ampscript/functions/field/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud-ampscript/references/mc-ampscript-data-extension/mc-ampscript-reference-data-extension-field.html"
  tagline: "On BuildRowSetFromString and BuildRowSetFromXML rows, Field returns its true/false flag instead of the column value"
  category: "Data Extension"
  object: "Data Extension"
  severity: "high"
  discrepancy: "A1"
  anchor: "field-returns-flag-not-value"
  body: |
    The reference describes `Field` as handing back the content of the named column of a row; its own example reads a column of a rowset row and prints the stored value.

    In a Marketing Cloud Next email, on the first row of `BuildRowSetFromString("a,b,c", ",")` (whose single column holds `a`):

    - `Field(@row, "Value")` rendered `true`, in the variable form and in the nested inline form.
    - With an explicit third argument, the same call rendered the flag itself: `true` for `true`, `1` and `"true"`; `false` for `false`, `0`, `"false"` and `"0"` (and also for `"1"`). The cell value `a` never came back.

    On `BuildRowSetFromXML` rows (XML built from `Char()`, so the email save keeps the tags) the same happens: `Field(Row(@rows, 2), "Value", 0)` rendered `false` instead of `200.00`, the `Xml` and `<name>_att` columns read with `0` gave `false`, and reading by position gave `true`.

    The flag comes back on `BuildRowSetFromString` rows, on `BuildRowSetFromXML` rows and on the `Value` column of `BuildRowsetFromJSON` rows, while named object columns of `BuildRowsetFromJSON` rows and `RetrieveSalesforceObjects` rows return the value.
  testScript: |
    %%[
      SET @rs = BuildRowSetFromString("a,b,c", ",")
      SET @row = Row(@rs, 1)
      SET @v = Field(@row, "Value")
    ]%%
    %%=v(@v)=%%

