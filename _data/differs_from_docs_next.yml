- name: "Substring"
  url: "/next/ampscript/functions/substring/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud-ampscript/references/mc-ampscript-string/mc-ampscript-reference-string-substring.html"
  tagline: "A start position past the end breaks the preview instead of returning an empty string"
  category: "String"
  object: "String"
  severity: "high"
  discrepancy: "A2"
  anchor: "substring-start-past-end-fails"
  body: |
    The official page says that a start position beyond the length of the source gives an empty string. In Next, `Substring("Hello World", 12)` and `Substring("Hello World", 20, 3)` let the email save, but the preview fails (HTTP 500, or no new rendered version). A start of `0` (`Substring("Hello World", 0, 5)`) or a negative start (`Substring("Hello World", -3, 5)`) fails the same way.

    Check the start against `Length` before calling Substring.
  testScript: |
    %%=Substring("Hello World", 12)=%%

- name: "Substring"
  url: "/next/ampscript/functions/substring/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud-ampscript/references/mc-ampscript-string/mc-ampscript-reference-string-substring.html"
  tagline: "A numeric source or a position given as text makes the preview fail"
  category: "String"
  object: "String"
  severity: "medium"
  discrepancy: "A5"
  anchor: "substring-strict-argument-types"
  body: |
    The official page types the source as a string and the positions as numbers, but does not say what happens when a value arrives in the other form, as it does when read from a text field. In Next, a quoted position (`Substring("Hello World", "7", 3)`, `Substring("Hello World", 7, "3")`, `Substring("Hello World", "1", "5")`) and a numeric or boolean source (`Substring(9876543, 3, 2)`, `Substring(true, 1, 2)`) each let the email save, then the preview fails.
  testScript: |
    %%=Substring("Hello World", "7", 3)=%%

- name: "Subtract"
  url: "/next/ampscript/functions/subtract/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud-ampscript/references/mc-ampscript-math/mc-ampscript-reference-math-subtract.html"
  tagline: "A negative first operand broke the email preview"
  category: "Math"
  object: "Math"
  severity: "high"
  discrepancy: "A7"
  anchor: "subtract-negative-operand-fails"
  body: |
    The official reference says both operands may be positive or negative, whole or decimal.

    In a Marketing Cloud Next email, `Subtract(-5, 3)` saved, but the email preview then failed with HTTP 500 and no message. This was one probe, so a negative literal as the first argument was not shown to work in Next; a negative result such as `Subtract(1.5, 2.25)` (`-0.75`) renders correctly.
  testScript: |
    %%=Subtract(-5,3)=%%

- name: "Trim"
  url: "/next/ampscript/functions/trim/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud-ampscript/references/mc-ampscript-string/mc-ampscript-reference-string-trim.html"
  tagline: "The non-breaking space is not treated as whitespace"
  category: "String"
  object: "String"
  severity: "low"
  discrepancy: "A7"
  anchor: "trim-keeps-non-breaking-space"
  body: |
    The official page says Trim strips whitespace from both ends. In Next, tab, line feed and carriage return are stripped, but the non-breaking space (`Char(160)`) is not: `Length(Trim(Concat(Char(160), "x", Char(160))))` is `3`.

    Values pasted from web pages or word processors often carry non-breaking spaces; remove them with `Replace` first.
  testScript: |
    %%=Length(Trim(Concat(Char(160), "x", Char(160))))=%%

- name: "Trim"
  url: "/next/ampscript/functions/trim/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud-ampscript/references/mc-ampscript-string/mc-ampscript-reference-string-trim.html"
