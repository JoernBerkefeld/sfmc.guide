- name: "{{equals}}"
  url: "/next/handlebars/helpers/equals/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/handlebars-for-marketing-cloud-next/references/mcn-handlebars-comparison-references/mcn-handlebars-reference-comparison-equals.html"
