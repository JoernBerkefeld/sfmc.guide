- name: "DateAdd"
  url: "/next/ampscript/functions/dateadd/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud-ampscript/references/mc-ampscript-date-time/mc-ampscript-reference-date-time-date-add.html"
  tagline: "A decimal amount is silently cut to a whole number"
  category: "Date and Time"
  object: "Date and Time"
  severity: "low"
  discrepancy: "A5"
  anchor: "dateadd-decimal-amount-truncated"
  body: |
    The reference types the amount as a number and does not say that fractions are dropped.

    In a Next email (2026-11-23), `DateAdd("2026-03-04 13:52:07", 1.5, "D")` rendered `2026-03-05T13:52:07`: one day was added and the half day was discarded without any error. Convert fractional amounts to a smaller unit (for example `36` with `H`) before calling it.
  testScript: |
    %%=DateAdd("2026-03-04 13:52:07", 1.5, "D")=%%

- name: "DateAdd"
  url: "/next/ampscript/functions/dateadd/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud-ampscript/references/mc-ampscript-date-time/mc-ampscript-reference-date-time-date-add.html"
  tagline: "The result prints in ISO form, not in the US form the reference shows"
  category: "Date and Time"
  object: "Date and Time"
  severity: "medium"
  discrepancy: "A7"
  anchor: "dateadd-prints-iso"
  body: |
    The reference's example prints a `DateAdd` result as a US date with a 12-hour clock (one day after a 13:41:23 timestamp comes out as `8/6/2023 1:41:23 PM`); the `DateDiff` reference shows the same form for a `DateAdd` value.

    In a Next email (2026-11-22), `%%=DateAdd("2026-01-15", 7, "D")=%%` rendered `2026-01-22T00:00:00`, and `DateAdd("2026-03-04 13:52:07", -3, "H")` rendered `2026-03-04T10:52:07`: date and time joined by `T`, 24-hour clock, no time zone. Wrap the value in `Format` or `FormatDate` when the shape matters.
  testScript: |
    %%=DateAdd("2026-01-15", 7, "D")=%%

- name: "DateDiff"
  url: "/next/ampscript/functions/datediff/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud-ampscript/references/mc-ampscript-date-time/mc-ampscript-reference-date-time-date-diff.html"
  tagline: "Counts whole elapsed units and drops the remainder, which the reference never states"
  category: "Date and Time"
  object: "Date and Time"
  severity: "medium"
  discrepancy: "A5"
  anchor: "datediff-whole-elapsed-units"
  body: |
    The reference only says the start date is subtracted from the end date in the chosen unit; it does not say whether a partial unit or a crossed calendar boundary counts.

    In a Next email (2026-11-23) the result is the elapsed time divided by the unit with the remainder discarded:

    - `DateDiff("2026-01-10 08:00:00", "2026-01-11 07:00:00", "D")` gives `0` (23 hours across midnight).
    - `DateDiff("2026-12-31 23:59:00", "2027-01-01 00:00:00", "Y")` gives `0`, and `"M"` and `"D"` give `0` too (one minute across New Year).
    - `DateDiff("2026-01-10 08:00:00", "2027-01-09 08:00:00", "Y")` gives `0` (364 days); 29 days from January 10 give `0` months.
    - From `2026-03-04 13:52:07` to `2027-05-09 09:15:31` the day count is `430`.

    Code that counts calendar days ("is the date tomorrow?") gets `0` where a boundary count would give `1`.
  testScript: |
