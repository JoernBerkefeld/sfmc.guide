- name: "Multiply"
  url: "/next/ampscript/functions/multiply/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud-ampscript/references/mc-ampscript-math/mc-ampscript-reference-math-multiply.html"
  tagline: "The product is rounded to two decimals"
  category: "Math"
  object: "Math"
  severity: "medium"
  discrepancy: "A5"
  anchor: "multiply-rounds-two-decimals"
  body: |
    The official reference allows decimal operands and only says the function returns the product; it mentions no rounding.

    In a Marketing Cloud Next email, `Multiply(1.5, 2.25)` renders `3.38`, not the exact product `3.375`. Results with more than two decimals are rounded.
  testScript: |
