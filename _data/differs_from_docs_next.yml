  severity: "high"
  discrepancy: "A7"
  anchor: "random-reversed-bounds-fail"
  body: |
    The official reference says the order of the two bounds does not matter.

    In a Marketing Cloud Next email, an email with a 60-draw loop calling `Random(3, 1)` saved, but the email preview then failed with HTTP 500 (one probe). Pass the lower bound first.
  testScript: |
