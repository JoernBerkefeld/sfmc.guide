- name: "IIf"
  url: "/next/ampscript/functions/iif/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud-ampscript/references/mc-ampscript-utilities/mc-ampscript-reference-utilities-iif.html"
  tagline: "Both branches are evaluated, so a failing call in the unused branch breaks the email"
  category: "Utility"
  object: "Utility"
  severity: "high"
  discrepancy: "A5"
  anchor: "iif-evaluates-both-branches"
  body: |
    The reference describes `IIf` as handing back one of its two values depending on the condition, and its example uses a function call in a branch. It does not warn that the branch that is not chosen still runs.

    In a Marketing Cloud Next email both branches are evaluated:

    - `IIf(1 == 1, "T", RaiseError("…"))` saved and published, but the preview failed with HTTP 500.
    - `IIf(1 == 2, RaiseError("…"), "F")` failed the same way.

    Use an `IF` block, not `IIf`, to keep a failing or costly call from running.
  testScript: |
    %%=IIf(1 == 1, "T", RaiseError("false branch evaluated"))=%%

- name: "IIf"
  url: "/next/ampscript/functions/iif/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud-ampscript/references/mc-ampscript-utilities/mc-ampscript-reference-utilities-iif.html"
  tagline: "A plain string as the condition: \"0\" and whitespace count as true, \"false\" as false"
  category: "Utility"
  object: "Utility"
  severity: "medium"
  discrepancy: "A5"
  anchor: "iif-string-condition-truthiness"
  body: |
    The reference types the condition as a string but does not say which string values count as true.

    In a Marketing Cloud Next email, with a variable as the whole condition (`IIf(@x, "T", "F")`):

    - `"hello"`, `"0"` and whitespace selected the true branch (written as a literal, the run of spaces reaches AMPscript as a single space, because the render collapses runs of spaces).
    - the empty string, the number `0`, the string `"false"`, a declared but unset variable and an undeclared variable selected the false branch.

    So the string `"0"` is true while the number `0` is false, and whitespace counts as a value. Use `Empty(@x)` or an explicit comparison as the condition instead of the bare value.
  testScript: |
    %%[ SET @x = "0" ]%%
    %%=IIf(@x, "T", "F")=%%

- name: "IndexOf"
  url: "/next/ampscript/functions/indexof/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud-ampscript/references/mc-ampscript-string/mc-ampscript-reference-string-index-of.html"
  tagline: "An empty search value reports a match at position 1"
  category: "String"
  object: "String"
  severity: "low"
  discrepancy: "A5"
  anchor: "indexof-empty-substring"
  body: |
    The docs do not cover an empty search value. In Next, `IndexOf("Hello", "")` gives `1`, the same result as a real match at the first character, while an empty source gives `0` (`IndexOf("", "a")` and `IndexOf("", "")`).

    Code that treats any non-zero result as "found" reads an empty search value as a hit.
  testScript: |
    %%=IndexOf("Hello", "")=%%

- name: "IndexOf"
  url: "/next/ampscript/functions/indexof/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud-ampscript/references/mc-ampscript-string/mc-ampscript-reference-string-index-of.html"
  tagline: "The search ignores letter case, which the docs never mention"
  category: "String"
  object: "String"
  severity: "medium"
  discrepancy: "A5"
  anchor: "indexof-ignores-case"
  body: |
    The official page explains that IndexOf returns where a character or substring starts, and its own example looks for a capital `C` in a ticket ID. It says nothing about letter case. In a Next email the search is case-insensitive: `IndexOf("Hello World","WORLD")`, `IndexOf("Hello World","world")` and `IndexOf("Hello World","World")` all give `7`, and `IndexOf("Hello World","h")` gives `1`.

    A test for an upper-case code letter therefore also matches the lower-case letter.
  testScript: |
    %%=IndexOf("Hello World", "WORLD")=%%

- name: "IndexOf"
  url: "/next/ampscript/functions/indexof/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud-ampscript/references/mc-ampscript-string/mc-ampscript-reference-string-index-of.html"
  tagline: "A number or boolean argument makes the email preview fail"
  category: "String"
  object: "String"
  severity: "medium"
  discrepancy: "A5"
  anchor: "indexof-number-breaks-preview"
  body: |
    The official page types both parameters as strings but does not say what happens to other values. In Next, a bare number or boolean in either position lets the email save, then the preview fails with HTTP 500: `IndexOf(9876543, "65")`, `IndexOf("a1b2c3", 2)`, `IndexOf(true, "ru")` and `IndexOf("is true here", true)` each failed on their own.

    There is no error value to test for; pass numbers as quoted strings.
  testScript: |
    %%=IndexOf(9876543, "65")=%%

- name: "IsEmailAddress"
  url: "/next/ampscript/functions/isemailaddress/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud-ampscript/references/mc-ampscript-utilities/mc-ampscript-reference-utilities-is-email-address.html"
  tagline: "Documented as unavailable in Next, yet it renders in a Next email"
  category: "Utility"
  object: "Utility"
  severity: "medium"
  discrepancy: "A6"
  anchor: "isemailaddress-available-in-next"
  body: |
    The availability table of the official reference marks `IsEmailAddress` as not supported in Marketing Cloud Next.

    A Marketing Cloud Next email containing it saved, published and rendered in the preview on 2026-11-22 and 2026-11-23. Every result matched the result table of the same page: `IsEmailAddress("tomas.q@example.com")` rendered `true`, an address without a dot in the domain also rendered `true`, and addresses without an at sign, with two at signs or with an empty local part rendered `false`.
  testScript: |
    %%=IsEmailAddress("tomas.q@example.com")=%%

- name: "IsNull"
  url: "/next/ampscript/functions/isnull/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud-ampscript/references/mc-ampscript-utilities/mc-ampscript-reference-utilities-is-null.html"
  tagline: "The empty string counts as null"
  category: "Utility"
  object: "Utility"
  severity: "medium"
  discrepancy: "A2"
  anchor: "isnull-empty-string-is-null"
  body: |
    The reference sets `IsNull` apart from `Empty` exactly on this point: `Empty` treats the empty string as empty, `IsNull` is said not to.

    In a Marketing Cloud Next email, a variable set to `""` made `IsNull` render `true`, the same as a declared but unset variable and an undeclared one. `IsNull(v(@unset))` also rendered `true`. Whitespace, `0`, `"0"`, `"false"` and `"hello"` rendered `false`.

    Code that relies on `IsNull` to tell an empty string from a missing value cannot do so in Next.
  testScript: |
    %%[ SET @s = "" ]%%
    %%=IsNull(@s)=%%

- name: "IsNullDefault"
  url: "/next/ampscript/functions/isnulldefault/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud-ampscript/references/mc-ampscript-sites/mc-ampscript-reference-sites-is-null-default.html"
  tagline: "Documented as unavailable in Next, yet it renders in a Next email"
  category: "Utility"
  object: "Utility"
  severity: "medium"
  discrepancy: "A6"
  anchor: "isnulldefault-available-in-next"
  body: |
    The availability table of the official reference marks `IsNullDefault` as not supported in Marketing Cloud Next.

    A Marketing Cloud Next email containing it saved, published and rendered in the preview on 2026-11-22 and 2026-11-23. The page also ties the function to Smart Capture form fields; in a plain Next email it works on ordinary variables. A variable declared and never set rendered the fallback (`IsNullDefault(@unset, "DEF")` gave `DEF`), as did the empty string, while a set value such as `"hello"` came back unchanged.
  testScript: |
    %%[ VAR @tier ]%%%%=IsNullDefault(@tier, "DEF")=%%

- name: "Length"
  url: "/next/ampscript/functions/length/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud-ampscript/references/mc-ampscript-string/mc-ampscript-reference-string-length.html"
  tagline: "Length counts UTF-16 code units, so an emoji measures 2"
  category: "String"
  object: "String"
  severity: "low"
  discrepancy: "A5"
  anchor: "length-counts-utf16-units"
  body: |
    The official page describes Length as the length of the string without naming the unit. In Next it counts UTF-16 code units: `Length("café")` is `4` and `Length("Straße")` is `6`, but a single emoji, `Length("😀")`, is `2`.

    A character limit enforced with Length allows one character fewer for every emoji or other character outside the Basic Multilingual Plane.
  testScript: |
    %%=Length("😀")=%%

- name: "Length"
  url: "/next/ampscript/functions/length/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud-ampscript/references/mc-ampscript-string/mc-ampscript-reference-string-length.html"
