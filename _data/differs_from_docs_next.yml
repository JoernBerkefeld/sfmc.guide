  object: "String"
  severity: "medium"
  discrepancy: "A5"
  anchor: "length-number-breaks-preview"
  body: |
    The official page asks for a string and does not say what happens to other values. In Next, `Length(12345)` and `Length(true)` let the email save, but the preview fails with HTTP 500.

    Pass a number as a quoted string when you need its length.
  testScript: |
    %%=Length(12345)=%%

- name: "LookupRows"
  url: "/next/ampscript/functions/lookuprows/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud-ampscript/references/mc-ampscript-data-extension/mc-ampscript-reference-data-extension-lookup-rows.html"
  tagline: "Listed as unavailable in Next, but it reads marketing object rows"
  category: "Data Extension"
  object: "Data Extension"
  severity: "medium"
  discrepancy: "A6"
  anchor: "lookuprows-available-in-next"
  body: |
    The availability table of the reference marks the function as not available in Marketing Cloud Next.

    In Next emails tested on 2026-11-25, one call per email, on a test marketing object: `LookupRows("zzprobecoupons__mo", "CouponCode__c", "PROBE0001")` returned one row and `Field` read `PROBE0001` from it. A filter on another field (`"IsClaimed__c", "false"`) returned the matching row too, and a value nothing matches returned `RowCount` `0`.
  testScript: |
    %%[ SET @lr1 = LookupRows("zzprobecoupons__mo","CouponCode__c","PROBE0001") ]%%%%=RowCount(@lr1)=%%|%%=Field(Row(@lr1,1),"CouponCode__c")=%%

- name: "Lowercase"
  url: "/next/ampscript/functions/lowercase/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud-ampscript/references/mc-ampscript-string/mc-ampscript-reference-string-lowercase.html"
  tagline: "The dotted capital I turns into two characters"
  category: "String"
  object: "String"
  severity: "low"
  discrepancy: "A5"
  anchor: "lowercase-dotted-capital-i"
  body: |
    The official page only says the function converts a string to lower case. In Next, `Lowercase("İ")` (capital I with dot above) gives a plain `i` followed by a combining dot above (U+0307): two code units instead of one.

    Other accented capitals keep their length: `Lowercase("CAFÉ")` gives `café`.
  testScript: |
    %%=Lowercase("İ")=%%

- name: "MD5"
  url: "/next/ampscript/functions/md5/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud-ampscript/references/mc-ampscript-encryption/mc-ampscript-reference-encryption-md5.html"
  tagline: "Marked as not available in Next, but it renders in a Next email"
  category: "Encryption and Encoding"
  object: "Encryption and Encoding"
  severity: "medium"
  discrepancy: "A6"
  anchor: "md5-available-in-next"
  body: |
    The official reference lists MD5 as not available in Marketing Cloud Next. A reader following it would avoid the function, or replace it with a workaround.

    In a Marketing Cloud Next email it saved and rendered: `%%=MD5("abc")=%%` gives `900150983cd24fb0d6963f7d28e17f72`, which is the correct MD5 digest. Calls with the documented `UTF-8` and `UTF-16` character sets rendered too.
  testScript: |
