- name: "RegExMatch"
  url: "/next/ampscript/functions/regexmatch/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud-ampscript/references/mc-ampscript-string/mc-ampscript-reference-string-regex-match.html"
  tagline: "The docs mark RegExMatch as unavailable in Next, but one call form renders"
  category: "String"
  object: "String"
  severity: "medium"
  discrepancy: "A6"
  anchor: "regexmatch-available-in-next"
  body: |
    The availability table on the official RegExMatch page says the function is not available in Marketing Cloud Next. In a Next email, `RegExMatch("order-4821-eu", "[0-9]+", "0")`, with the group selector in quotes, rendered `4821`.

    A named group chosen by name renders too: `RegExMatch("order-4821-eu", Concat("order-(?", Char(60), "num", Char(62), "[0-9]+)-"), "num")` gave `4821` (the `<` and `>` are built with `Char()` because the email save strips `<num>` from a literal pattern). Most other tested calls saved but made the preview fail (see the companion card on the group selector), so treat support in Next as partial.
  testScript: |
    %%=RegExMatch("order-4821-eu", "[0-9]+", "0")=%%

- name: "RegExMatch"
  url: "/next/ampscript/functions/regexmatch/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud-ampscript/references/mc-ampscript-string/mc-ampscript-reference-string-regex-match.html"
  tagline: "A bare number as the group selector makes the email preview fail"
  category: "String"
  object: "String"
  severity: "high"
  discrepancy: "A7"
  anchor: "regexmatch-numeric-group-breaks-preview"
  body: |
    The official page lets the third argument be a group name or ordinal, and its examples pass a bare `0`. In Next every tested call with an unquoted number there saved, then the preview failed (HTTP 500, or no new rendered version): `RegExMatch("SAVE23", "^[A-Z0-9]{5,7}$", 0)`, `RegExMatch("order-4821-eu", "[0-9]+", 0)`, `RegExMatch("order-4821-eu", "order-([0-9]+)-", 1)` and `RegExMatch("order-4821-eu", "order-([0-9]+)-([a-z]+)", 2)`.

    Only quoted selectors rendered: `"0"`, and a named group chosen by its name (`"num"`, with the pattern's `<` and `>` built from `Char()`). It is open whether quoted group numbers above 0 work.
  testScript: |
    %%=RegExMatch("order-4821-eu", "[0-9]+", 0)=%%

- name: "Replace"
  url: "/next/ampscript/functions/replace/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud-ampscript/references/mc-ampscript-string/mc-ampscript-reference-string-replace.html"
  tagline: "The search value matches regardless of letter case"
  category: "String"
  object: "String"
  severity: "medium"
  discrepancy: "A5"
  anchor: "replace-ignores-case"
  body: |
    The official page says Replace swaps the search substring for the replacement and says nothing about case. In Next the match is case-insensitive: `Replace("Cat cat CAT", "cat", "dog")` gives `dog dog dog`, `Replace("Hello World", "WORLD", "There")` gives `Hello There`, and `Replace("Hello World", "hELLO", "Howdy")` gives `Howdy World`.

    A replacement aimed at one spelling hits every casing of it.
  testScript: |
    %%=Replace("Cat cat CAT", "cat", "dog")=%%

- name: "Replace"
  url: "/next/ampscript/functions/replace/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud-ampscript/references/mc-ampscript-string/mc-ampscript-reference-string-replace.html"
  tagline: "A number or boolean argument makes the email preview fail"
  category: "String"
  object: "String"
  severity: "medium"
  discrepancy: "A5"
  anchor: "replace-number-breaks-preview"
  body: |
    All three parameters are typed as strings on the official page, which does not say what happens to other values. In Next, a bare number or boolean in any position lets the email save, then the preview fails with HTTP 500: `Replace(101101, "0", "9")`, `Replace("a1b1c", 1, "-")`, `Replace("a-b", "-", 7)`, `Replace(true, "ru", "X")`, `Replace("is true here", true, "X")` and `Replace("a-b", "-", true)` each failed on their own.

    Quote numeric values.
  testScript: |
    %%=Replace("a-b", "-", 7)=%%

- name: "ReplaceList"
  url: "/next/ampscript/functions/replacelist/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud-ampscript/references/mc-ampscript-string/mc-ampscript-reference-string-replace-list.html"
  tagline: "Search values match regardless of letter case"
  category: "String"
  object: "String"
  severity: "medium"
  discrepancy: "A5"
  anchor: "replacelist-ignores-case"
  body: |
    The official page does not say whether the search strings are case-sensitive. In Next they are not: `ReplaceList("Hello World", "There", "WORLD")` gives `Hello There`, `ReplaceList("Cat cat CAT", "dog", "cat")` gives `dog dog dog`, and `ReplaceList("Red BLUE green", "-", "red", "blue", "GREEN")` gives `- - -`.
  testScript: |
    %%=ReplaceList("Cat cat CAT", "dog", "cat")=%%

- name: "ReplaceList"
  url: "/next/ampscript/functions/replacelist/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud-ampscript/references/mc-ampscript-string/mc-ampscript-reference-string-replace-list.html"
  tagline: "A number or boolean argument makes the email preview fail"
  category: "String"
  object: "String"
  severity: "medium"
  discrepancy: "A5"
  anchor: "replacelist-number-breaks-preview"
  body: |
    The official page types every parameter as a string and does not say what happens to other values. In Next, a bare number or boolean in any position lets the email save, then the preview fails with HTTP 500: `ReplaceList(101101, "9", "0")`, `ReplaceList("a-b", 7, "-")`, `ReplaceList("a1b", "-", 1)`, `ReplaceList(true, "X", "ru")`, `ReplaceList("a-b", true, "-")` and `ReplaceList("is true here", "X", true)` each failed on their own.

    Quote numeric values.
  testScript: |
    %%=ReplaceList("a1b", "-", 1)=%%

- name: "ReplaceList"
  url: "/next/ampscript/functions/replacelist/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud-ampscript/references/mc-ampscript-string/mc-ampscript-reference-string-replace-list.html"
  tagline: "Each search value runs on the output of the previous one"
  category: "String"
  object: "String"
  severity: "low"
  discrepancy: "A5"
  anchor: "replacelist-search-values-chain"
  body: |
    The official page presents the search strings as a list that are all replaced, without saying they are applied one after another. In Next they are, on the already-changed text: `ReplaceList("a", "XY", "a", "X")` gives `XYY`, because the second search value finds the `X` the first one inserted. Order also matters: `ReplaceList("abc", "-", "ab", "bc")` gives `-c`, while `ReplaceList("abc", "-", "bc", "ab")` gives `a-`.

    A replacement that contains a later search value is replaced again.
  testScript: |
    %%=ReplaceList("a", "XY", "a", "X")=%%

- name: "SHA1"
