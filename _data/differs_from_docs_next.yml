  body: |
    The reference says nothing about the rounding rule or about a locale code it does not know.

    In a Marketing Cloud Next email:

    - `FormatCurrency(2.345, "en-US")` rendered `$2.34`, while `FormatCurrency(2.355, "en-US")` rendered `$2.36`. `2.345` is rounded down although the docs show no rounding rule; whether this comes from the binary representation of the number or from rounding halves to the even digit was not isolated.
    - `FormatCurrency(1234.555, "zz-ZZ")` and `FormatCurrency(1234.555, "")` rendered `1234.555`, unformatted and without any error.
    - The language-only code `de` rendered `1.234,56 ¤`, with the generic currency sign (U+00A4) instead of a real symbol.
