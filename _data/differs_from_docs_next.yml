- name: "FormatCurrency"
  url: "/next/ampscript/functions/formatcurrency/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud-ampscript/references/mc-ampscript-utilities/mc-ampscript-reference-utilities-formatCurrency.html"
  tagline: "The decimal-places and currency-symbol arguments have no effect"
  category: "Utility"
  object: "Utility"
  severity: "high"
  discrepancy: "A3"
  anchor: "formatcurrency-ignores-decimals-and-symbol"
  body: |
    The reference describes the third argument as setting the number of decimals (rounding to a whole number with `0`, forcing two decimals for the yen with `2`) and the fourth as replacing the locale's currency symbol, with `Mex$` for Mexico as its example.

    In a Marketing Cloud Next email both arguments are accepted at save but change nothing:

    - `FormatCurrency(1234.555, "de-CH", 0)` rendered `CHF 1’234.56`, still with two decimals.
    - `FormatCurrency(1234.555, "ja-JP", 2)` rendered `￥1,235`, still without decimals.
    - `FormatCurrency(1234.555, "de-DE", 3)` and `FormatCurrency(1234.555, "en-US", "3")` kept two decimals.
    - `FormatCurrency(1234.555, "es-MX", 2, "Mex$")` rendered `$1,234.56`, and `FormatCurrency(1234.555, "de-DE", 2, "CHF")` rendered `1.234,56 €`.

    Only the locale decides the decimals and the symbol.
  testScript: |
    %%=FormatCurrency(1234.555, "es-MX", 2, "Mex$")=%%

- name: "FormatCurrency"
  url: "/next/ampscript/functions/formatcurrency/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud-ampscript/references/mc-ampscript-utilities/mc-ampscript-reference-utilities-formatCurrency.html"
  tagline: "Output contains non-ASCII spaces, apostrophes and a full-width yen sign"
  category: "Utility"
  object: "Utility"
  severity: "medium"
  discrepancy: "A7"
  anchor: "formatcurrency-non-ascii-characters"
  body: |
    The sample outputs on the reference page are written with ordinary spaces, a plain apostrophe for Switzerland and the regular yen sign `¥` (U+00A5).

    In a Marketing Cloud Next email the rendered amounts contain other characters:

    - `de-DE`: `1.234,56 €` with a non-breaking space (U+00A0) before the euro sign.
    - `fr-FR`: `1 234,56 €` with a narrow no-break space (U+202F) between the groups and U+00A0 before the sign.
    - `pt-BR`: `R$ 1.234,56` with U+00A0 after the symbol.
    - `de-CH`: `CHF 1’234.56` with a typographic apostrophe (U+2019) as group separator.
    - `ja-JP`: `￥1,235` with the full-width yen sign (U+FFE5).

    A comparison or replacement written against the characters shown in the docs does not match these results.
  testScript: |
    %%=FormatCurrency(1234.555, "ja-JP")=%%

- name: "FormatCurrency"
  url: "/next/ampscript/functions/formatcurrency/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud-ampscript/references/mc-ampscript-utilities/mc-ampscript-reference-utilities-formatCurrency.html"
