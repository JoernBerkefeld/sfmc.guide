- name: "{{dateAdd}}"
  url: "/next/handlebars/helpers/dateadd/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/handlebars-for-marketing-cloud-next/references/mcn-handlebars-date-time-references/mcn-handlebars-reference-date-time-dateadd.html"
  tagline: "Returns a T between date and time, not the documented space"
  category: "Handlebars Date & Time"
  object: "Handlebars Date & Time"
  severity: "medium"
  discrepancy: "A7"
  anchor: "hb-dateadd-t-separator"
  body: |
    The reference states the result is a date-time string shaped `yyyy-MM-dd HH:mm:ss`, with a space between date and time, and shows `2025-02-28 00:00:00` for its leap-year example.

    In a Marketing Cloud Next email tested on 2026-11-22: The date math was right, but the separator is a `T`: `{{dateAdd "2024-02-29" 1 "Y"}}` rendered `2025-02-28T00:00:00` and `{{dateAdd "2025-01-31" 1 "D"}}` rendered `2025-02-01T00:00:00`. Code that compares or splits the result on the space breaks.
  testScript: |
    {{dateAdd "2024-02-29" 1 "Y"}}

- name: "{{encodeURI}}"
