- name: "URLEncode"
  url: "/next/ampscript/functions/urlencode/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud-ampscript/references/mc-ampscript-http/mc-ampscript-reference-http-url-encode.html"
  tagline: "Marked as not available in Next, but it renders in a Next email"
  category: "Encryption and Encoding"
  object: "Encryption and Encoding"
  severity: "medium"
  discrepancy: "A6"
  anchor: "urlencode-available-in-next"
  body: |
    The official reference lists URLEncode as not available in Marketing Cloud Next. A reader following it would avoid the function, or replace it with a workaround.

    In a Marketing Cloud Next email it saved and rendered: `%%=URLEncode("spring sale",0,1)=%%` gives `spring%20sale`, which is the correct encoding. The calls with the flags switched off or `encodeAllStrings` on rendered as well; the output with `encodeAllChars` on is covered by a separate card.
  testScript: |
    %%=URLEncode("spring sale",0,1)=%%

- name: "URLEncode"
  url: "/next/ampscript/functions/urlencode/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud-ampscript/references/mc-ampscript-http/mc-ampscript-reference-http-url-encode.html"
  tagline: "encodeAllChars leaves = and & alone and never writes spaces as +"
  category: "Encryption and Encoding"
  object: "Encryption and Encoding"
  severity: "medium"
  discrepancy: "A7"
  anchor: "urlencode-encodeallchars-output"
  body: |
    The official reference's examples for the second (and third) flag show the query string fully escaped: `=` and `:` become lowercase `%3d` / `%3a`, and spaces become `+`.

    In a Marketing Cloud Next email, `URLEncode("https://example.org/go?promo=spring sale&tags=a,b", 1)` renders `https://example.org/go?promo=spring%20sale&tags=a%2Cb`: `=` and `&` are kept, the space is `%20`, and the only escape added is an uppercase `%2C` for the comma. With both flags on, `URLEncode("spring sale", 1, 1)` renders `spring%20sale`, not `spring+sale`. Every spelling of the flags (`1`, `true`, `"1"`, `"true"`) gives the same result.
  testScript: |
    %%=URLEncode("https://example.org/go?promo=spring sale&tags=a,b",1)=%%
    %%=URLEncode("spring sale",1,1)=%%

- name: "v"
  url: "/next/ampscript/functions/v/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud-ampscript/references/mc-ampscript-utilities/mc-ampscript-reference-utilities-v.html"
  tagline: "A quoted variable name is written out literally instead of the variable value"
  category: "Utility"
  object: "Utility"
  severity: "low"
  discrepancy: "A5"
  anchor: "v-quoted-name-written-literally"
  body: |
    The reference types the argument as a string naming the variable whose value should be written. It does not say what happens when that name is passed as a quoted string.

    In a Marketing Cloud Next email, `v("p")` rendered the letter `p`, not the value of a variable `@p`; a number literal such as `v(5)` rendered `5`. A quoted or mistyped name therefore prints itself silently instead of failing. Pass the variable itself, such as `v(@p)`.
  testScript: |
    %%[ SET @p = "value" ]%%
    %%=v("p")=%%

- name: "{{add}}"
  url: "/next/handlebars/helpers/add/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/handlebars-for-marketing-cloud-next/references/mcn-handlebars-math-references/mcn-handlebars-reference-math-add.html"
