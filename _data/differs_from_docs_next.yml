- name: "FormatDate"
  url: "/next/ampscript/functions/formatdate/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud-ampscript/references/mc-ampscript-date-time/mc-ampscript-reference-date-time-format-date.html"
  tagline: "Locale formatting with D, S and L does not produce locale dates"
  category: "Date and Time"
  object: "Date and Time"
  severity: "high"
  discrepancy: "A7"
  anchor: "formatdate-locale-formats-ignored"
  body: |
    The reference shows the standard format `D` producing a long date per locale (for example a French long date for `fr_FR`), and documents `S` and `L` with a locale code as short and long dates in that locale's notation (for example `05.08.2024` for `uk_UA`).

    In a Next email (2026-11-23), with an empty time pattern and a locale code:

    - `FormatDate(@d, "D", "", "fr-FR")` rendered `63 ` (the day of the year), and so did `fr_FR` and `ja-JP`.
    - `FormatDate(@d, "S", "", "uk_UA")` and `FormatDate(@d, "S", "", "en-US")` rendered `0 `.
    - Without a locale, `L` rendered `3` and `S` rendered `0`.

    `@d` is `2026-03-04 13:52:07`. A locale does change month names in a custom pattern (`MMMM` with `fr-FR` gave `mars`), so use custom patterns for localised dates.
  testScript: |
    %%=FormatDate("2026-03-04 13:52:07", "S", "", "uk_UA")=%%|%%=FormatDate("2026-03-04 13:52:07", "D", "", "fr-FR")=%%

- name: "FormatDate"
  url: "/next/ampscript/functions/formatdate/"
