  tagline: "Marked as not available in Next, but it renders in a Next email"
  category: "Encryption and Encoding"
  object: "Encryption and Encoding"
  severity: "medium"
  discrepancy: "A6"
  anchor: "sha1-available-in-next"
  body: |
    The official reference lists SHA1 as not available in Marketing Cloud Next. A reader following it would avoid the function, or replace it with a workaround.

    In a Marketing Cloud Next email it saved and rendered: `%%=SHA1("abc")=%%` gives `a9993e364706816aba3e25717850c26c9cd0d89d`, which is the correct SHA-1 digest. Calls with the documented `UTF-8` and `UTF-16` character sets rendered too.
