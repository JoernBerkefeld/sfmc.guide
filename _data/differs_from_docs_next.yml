    The official page asks for a string and does not say what happens to other values. In Next, `Trim(12345)` and `Trim(true)` let the email save, but the preview fails (no new rendered version, or HTTP 500). A number passed as text works: `Trim(Concat(Char(32), Char(32), "42", Char(32), Char(32)))` gives `42`.
