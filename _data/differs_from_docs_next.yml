- name: "Mod"
  url: "/next/ampscript/functions/mod/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud-ampscript/references/mc-ampscript-math/mc-ampscript-reference-math-mod.html"
  tagline: "The documented decimal example renders a different value"
  category: "Math"
  object: "Math"
  severity: "low"
  discrepancy: "A7"
  anchor: "mod-decimal-result-format"
  body: |
    The official reference shows a negative decimal example whose stated result carries a floating-point tail (`-1.88300000000001`).

    In a Marketing Cloud Next email, the same call `Mod(-500.123, 12.456)` renders `-1.883`. Whole results of a decimal divisor keep a trailing `.0`: `Mod(10, 3.5)` renders `3.0`, not `3`. Compare results numerically, not as text.
  testScript: |
    %%=Mod(-500.123,12.456)=%%

- name: "Mod"
  url: "/next/ampscript/functions/mod/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud-ampscript/references/mc-ampscript-math/mc-ampscript-reference-math-mod.html"
  tagline: "A dividend smaller than the divisor broke the email preview"
  category: "Math"
  object: "Math"
  severity: "high"
  discrepancy: "A5"
  anchor: "mod-small-dividend-fails"
  body: |
    The official reference accepts any two numbers and does not exclude a dividend smaller than the divisor.

    In a Marketing Cloud Next email, `Mod(3, 10)` saved, but the email preview then failed with HTTP 500 instead of giving `3`. This was one probe; `Mod(10, 3)`, `Mod(500, 12)` and `Mod(10.5, 3)` rendered correctly.
