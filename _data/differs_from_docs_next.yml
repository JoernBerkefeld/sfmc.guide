  category: "Handlebars Math"
  object: "Handlebars Math"
  severity: "high"
  discrepancy: "A7"
  anchor: "hb-add-decimal-string-http-500"
  body: |
    The reference says `add` accepts numbers or strings that convert to numbers, handles decimals, and rounds the sum to two decimal places.

    In a Marketing Cloud Next email tested on 2026-11-22: `{{add "1.5" 2.25}}` let the email save and publish, but the preview then failed with HTTP 500 and no message instead of rendering `3.75`. Whole numbers work: `{{add 2 3}}` rendered `5`.
  testScript: |
    {{add "1.5" 2.25}}

