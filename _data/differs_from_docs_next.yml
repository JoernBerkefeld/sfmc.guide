# Where Marketing Cloud Next behaves differently from what the official docs say for Next.
# PLATFORM: Marketing Cloud Next ONLY (AMPscript functions and Handlebars helpers).
# Rendered by /next/differs-from-docs/ via _includes/differs-from-docs-list.html
#
# "Official docs for Next" = the official AMPscript reference page (examples, stated outputs,
# parameter rules) plus its Next-specific parts (the Availability row for Next, the
# "Differences between Engagement and Next" sections, inline Next sentences), or the official
# Handlebars-for-Marketing-Cloud-Next helper page. The comparison is ALWAYS Next probe result vs.
# those docs, never Next vs. Engagement (that lives in each page's Engagement section).
# A card is due for a contradiction of a documented statement, or for notable behaviour the docs
# do not mention (A5). Every card's page carries a "## Differs from official docs" section that
# links the card; AMPscript pages set `differs_from_docs: true`, Handlebars pages
# `mcn: differs-from-docs` or `mcn: unsupported` (tests/ampscript-next-sync.test.cjs).
#
# Row format (all keys except `testScript` are required):
#
# - name: "FunctionName"                         # AMPscript function, or "{{helper}}" for Handlebars
#   url: "/next/ampscript/functions/<slug>/"     # the sfmc.guide page with the Differs section
#   officialUrl: "https://..."                   # the official page the finding is measured against
#   tagline: "short one-line summary of the discrepancy"
#   category: "Date functions"                   # shown as a pill
#   object: "Date functions"                     # grouping key for the "Sort by object" mode
#   severity: "high"                             # high | medium | low
#   discrepancy: "A1"                            # A1..A7, see the legend on /next/differs-from-docs/
#   anchor: "functionname-short-finding"         # unique slug, becomes the card id
#   body: |
#     What the docs say (paraphrased) and what a Next email actually rendered.
#   testScript: |
#     %%[ /* code that reproduces the discrepancy */ ]%%

- name: "Add"
  url: "/next/ampscript/functions/add/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud-ampscript/references/mc-ampscript-math/mc-ampscript-reference-math-add.html"
  tagline: "Sums wrap around at the 32-bit limit"
  category: "Math"
  object: "Math"
  severity: "medium"
  discrepancy: "A5"
  anchor: "add-32bit-wraparound"
  body: |
    The official reference states no limit on the size of the operands or of the sum.

    In a Marketing Cloud Next email, `Add(2147483647, 1)` renders `-2147483648`: the sum overflows a signed 32-bit integer and silently turns negative, with no error.
  testScript: |
    %%=Add(2147483647,1)=%%

- name: "Add"
  url: "/next/ampscript/functions/add/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud-ampscript/references/mc-ampscript-math/mc-ampscript-reference-math-add.html"
  tagline: "A negative first operand broke the email preview"
  category: "Math"
  object: "Math"
  severity: "high"
  discrepancy: "A7"
  anchor: "add-negative-operand-fails"
  body: |
    The official reference says both operands may be positive or negative, whole or decimal.

    In a Marketing Cloud Next email, `Add(-5, 3)` saved, but the email preview then failed with HTTP 500 and no message. This was one probe, so a negative literal as the first argument was not shown to work in Next; positive whole and decimal operands rendered correctly.
  testScript: |
    %%=Add(-5,3)=%%

- name: "BeginImpressionRegion"
  url: "/next/ampscript/functions/beginimpressionregion/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud-ampscript/references/mc-ampscript-content/mc-ampscript-reference-content-begin-impression-region.html"
  tagline: "Listed as unavailable in Next, but emails using it save and render"
  category: "Content"
  object: "Content"
  severity: "low"
  discrepancy: "A6"
  anchor: "beginimpressionregion-available-in-next"
  body: |
    The availability table of the reference marks the function as not available in Marketing Cloud Next.

    In a Next email (2026-11-22/23), `%%[ BeginImpressionRegion("ProbeRegion") ]%%X%%[ EndImpressionRegion() ]%%` saved, published and rendered `X`, and a variable as the region name (`BeginImpressionRegion(@name)`) rendered too. Whether impressions are actually tracked against the region was not tested: that only shows in send reports, not in a preview.
  testScript: |
    %%[ BeginImpressionRegion("ProbeRegion") ]%%X%%[ EndImpressionRegion() ]%%

- name: "BuildRowsetFromJSON"
  url: "/next/ampscript/functions/buildrowsetfromjson/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud-ampscript/references/mc-ampscript-content/mc-ampscript-reference-content-build-rowset-from-json.html"
  tagline: "A decimal such as 100.0 keeps its .0, unlike the documented rowset"
  category: "Content"
  object: "Content"
  severity: "low"
  discrepancy: "A7"
  anchor: "buildrowsetfromjson-decimal-kept"
  body: |
    The reference walks through a flights payload whose prices are written as `100.0`, `200.0` and `500.0` and shows the resulting rowset with the prices `100`, `200` and `500`.

    In a Next email (2026-11-22/23), the same kind of payload read back through `Field(Row(@rows, 1), "Price")` rendered `100.0`. Code that compares or prints the price as shown in the docs gets the trailing `.0`.
  testScript: |
    %%[ SET @rows = BuildRowsetFromJSON('{"Flights":[{"Origin":"IND","Dest":"NYC","Price":100.0}]}', "$.Flights[*]", 1) ]%%
    %%=Field(Row(@rows, 1), "Price")=%%

- name: "BuildRowsetFromJSON"
  url: "/next/ampscript/functions/buildrowsetfromjson/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud-ampscript/references/mc-ampscript-content/mc-ampscript-reference-content-build-rowset-from-json.html"
  tagline: "An unset variable as the payload breaks the render, and an empty string never renders"
  category: "Content"
  object: "Content"
  severity: "high"
  discrepancy: "A5"
  anchor: "buildrowsetfromjson-empty-payload-fails"
  body: |
    The reference says that with the flag `1` or `true`, a payload that is not valid JSON gives an empty rowset, and recommends checking `RowCount` to show fallback content.

    In a Next email (2026-11-23), an unset variable as the payload made the preview fail (HTTP 500), and with an empty string (`BuildRowsetFromJSON("", "$.Flights[*]", 1)`) the preview never showed a new rendered version, so no `RowCount` check is ever reached. A `[]` payload and a path that matches nothing do give `0` rows. Test the variable for content before calling the function.
  testScript: |
    %%[ SET @rows = BuildRowsetFromJSON("", "$.Flights[*]", 1) ]%%%%=RowCount(@rows)=%%

- name: "BuildRowsetFromJSON"
  url: "/next/ampscript/functions/buildrowsetfromjson/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud-ampscript/references/mc-ampscript-content/mc-ampscript-reference-content-build-rowset-from-json.html"
  tagline: "On invalid JSON the error flag does not behave as either part of the reference describes"
  category: "Content"
  object: "Content"
  severity: "medium"
  discrepancy: "A7"
  anchor: "buildrowsetfromjson-invalid-json-flag"
  body: |
    The reference's Errors section says invalid JSON raises an exception when the third argument is `0` or `false`, and gives an empty rowset when it is `1` or `true`. (Its parameter list describes the flag the other way round.)

    In a Next email (2026-11-23):

    - `BuildRowsetFromJSON("{ not json ", "$.Flights[*]", 0)` did not fail: the text after it rendered normally.
    - `BuildRowsetFromJSON("not json", "$.Flights[*]", 1)` gave `0` rows, as the Errors section says.
    - An email that called it on `{ not json ` with `true`, `"true"` and `"1"` together failed to render (HTTP 500) instead of giving three empty rowsets. Which of the three spellings causes the failure was not isolated.

    Do not rely on the flag to choose between an error and an empty rowset; check the payload first.
  testScript: |
    %%[ SET @rows = BuildRowsetFromJSON("{ not json ", "$.Flights[*]", 0) ]%%X

- name: "BuildRowsetFromJSON"
  url: "/next/ampscript/functions/buildrowsetfromjson/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud-ampscript/references/mc-ampscript-content/mc-ampscript-reference-content-build-rowset-from-json.html"
  tagline: "Columns cannot be read by number, and the Value column of a scalar path returns the Field flag"
  category: "Content"
  object: "Content"
  severity: "high"
  discrepancy: "A1"
  anchor: "buildrowsetfromjson-ordinal-and-value-reads"
  body: |
    The reference says a path that selects plain values yields a rowset with a `Value` column holding them, and its full code example reads the flight columns by number (`Field(Row(@rows, @row), @col)` with `@col` running from 1 to 4).

    In a Next email (2026-11-23):

    - On object rows (`$.Flights[*]`), `Field(Row(@rows, 1), 1)` and `Field(Row(@rows, 1), 2)` rendered empty strings instead of `IND` and `NYC`. Reading by key name (`"Origin"`) works.
    - On a scalar path (`$.Flights[*].Price`), the row count is right (`3`), but `Field(row, "Value", 0)` rendered `false` and `Field(row, 1)` rendered `true`, not `200`. The same happened for `$.Shapes[*]` over a string array; see [Field returns the flag](/next/differs-from-docs/#field-returns-flag-not-value).

    The documented example table would therefore come out with empty cells, and scalar results are not readable at all.
  testScript: |
    %%[ SET @rows = BuildRowsetFromJSON('{"Shapes":["Triangle","Circle","Square"]}', "$.Shapes[*]", 1) ]%%
    %%=RowCount(@rows)=%%|%%=Field(Row(@rows, 2), 1)=%%|%%=Field(Row(@rows, 2), "Value", 0)=%%

- name: "BuildRowSetFromString"
  url: "/next/ampscript/functions/buildrowsetfromstring/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud-ampscript/references/mc-ampscript-content/mc-ampscript-reference-content-build-rowset-from-string.html"
  tagline: "Listed as unavailable in Next, but emails using it save and render"
  category: "Content"
  object: "Content"
  severity: "medium"
  discrepancy: "A6"
  anchor: "buildrowsetfromstring-available-in-next"
  body: |
    The availability table of the reference marks the function as not available in Marketing Cloud Next.

    In a Next email (2026-11-22/23), `RowCount(BuildRowSetFromString("North**South**East**West", "**"))` rendered `4`, `a,b,` gave `3` rows and an empty string gave `0`. The function is accepted and splits the string; reading the segments back is a separate problem (see the card on reading values).
  testScript: |
    %%=RowCount(BuildRowSetFromString("North**South**East**West", "**"))=%%

- name: "BuildRowSetFromString"
  url: "/next/ampscript/functions/buildrowsetfromstring/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud-ampscript/references/mc-ampscript-content/mc-ampscript-reference-content-build-rowset-from-string.html"
  tagline: "Reading a segment by column number returns true instead of the text"
  category: "Content"
  object: "Content"
  severity: "high"
  discrepancy: "A1"
  anchor: "buildrowsetfromstring-ordinal-returns-true"
  body: |
    The reference explains that the single, unnamed column is read by its number, for example `Field(Row(BuildRowSetFromString('123|456', '|'), 1), 1)`, and its query-parameter example relies on that to get each name.

    In a Next email (2026-11-22/23), `Field(Row(BuildRowSetFromString("North**South**East**West", "**"), 1), 1)` rendered `true` instead of `North`; row 4 gave `true` instead of `West`, and input without the separator gave `true` instead of the text. The documented read by column number therefore does not return the segment; see [Field returns the flag](/next/differs-from-docs/#field-returns-flag-not-value).
  testScript: |
    %%=Field(Row(BuildRowSetFromString("North**South**East**West", "**"), 1), 1)=%%

- name: "BuildRowSetFromXML"
  url: "/next/ampscript/functions/buildrowsetfromxml/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud-ampscript/references/mc-ampscript-content/mc-ampscript-reference-content-build-rowset-from-xml.html"
  tagline: "Listed as unavailable in Next, but emails using it save and render"
  category: "Content"
  object: "Content"
  severity: "low"
  discrepancy: "A6"
  anchor: "buildrowsetfromxml-available-in-next"
  body: |
    The availability table of the reference marks the function as not available in Marketing Cloud Next.

    In Next emails (2026-11-23) it saved, published and rendered, and returned the same number of rows as Engagement once the XML was built with `Char()`: `<root><row>1</row><row>2</row></root>` with `//row` gave `2` rows, a document with three `Flight` elements gave `3` with `//Flight`, and `<root></root>` gave `0`. Two limits apply in Next: XML typed as a string literal loses its tags when the email is saved, and `Field` returns its flag instead of the node content (see the companion cards).
  testScript: |
    %%[
      SET @xml = Concat(Char(60), "root", Char(62), Char(60), "row", Char(62), "1", Char(60), "/row", Char(62), Char(60), "row", Char(62), "2", Char(60), "/row", Char(62), Char(60), "/root", Char(62))
      SET @rows = BuildRowSetFromXML(@xml, "//row", 1)
    ]%%
    %%=RowCount(@rows)=%%

- name: "BuildRowSetFromXML"
  url: "/next/ampscript/functions/buildrowsetfromxml/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud-ampscript/references/mc-ampscript-content/mc-ampscript-reference-content-build-rowset-from-xml.html"
  tagline: "On malformed XML a falsy flag breaks the render and a truthy flag gives an empty rowset"
  category: "Content"
  object: "Content"
  severity: "low"
  discrepancy: "A7"
  anchor: "buildrowsetfromxml-false-flag-fails"
  body: |
    The reference describes the third argument as giving an empty rowset on a syntax error when it is `false`, and an exception when it is `true`.

    In a Next email (2026-11-23), with the malformed document `<root><a>1</a>` built from `Char()`, the flag `0` made the preview fail (HTTP 500), while `1`, `true` and `"true"` each gave `0` rows: the opposite of the documented direction. The string `"1"`, tested alone, made the preview fail (HTTP 500) as well.
  testScript: |
    %%[ SET @rows = BuildRowSetFromXML(Concat(Char(60), "root", Char(62), Char(60), "a", Char(62), "1", Char(60), "/a", Char(62)), "//a", 0) ]%%X

- name: "BuildRowSetFromXML"
  url: "/next/ampscript/functions/buildrowsetfromxml/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud-ampscript/references/mc-ampscript-content/mc-ampscript-reference-content-build-rowset-from-xml.html"
  tagline: "Field returns its true/false flag instead of the node content on these rows"
  category: "Content"
  object: "Content"
  severity: "high"
  discrepancy: "A1"
  anchor: "buildrowsetfromxml-field-returns-flag"
  body: |
    The reference shows the rowset holding the node text in `Value`, the inner markup in `Xml` and one `<name>_att` column per attribute.

    In a Next email (2026-11-23), with the XML built from `Char()`, the row count was right (`3` for three `Flight` elements), but `Field(Row(@rows, 2), "Value", 0)` rendered `false` instead of `200.00`, and so did the `Xml` column and the `origin_att` and `carrier_att` columns read with `0`. Reading by position (`Field(row, 1)` to `Field(row, 5)`) rendered `true`. The node content never came back.

    `Field` does the same on other built rowsets; see [Field returns the flag, not the value](/next/differs-from-docs/#field-returns-flag-not-value).
  testScript: |
    %%[
      SET @xml = Concat(Char(60), "root", Char(62), Char(60), "Flight origin=", Char(34), "IND", Char(34), Char(62), "100.00", Char(60), "/Flight", Char(62), Char(60), "/root", Char(62))
      SET @rows = BuildRowSetFromXML(@xml, "//Flight", 1)
    ]%%
    %%=Concat(RowCount(@rows), "|", Field(Row(@rows, 1), "Value", 0))=%%

- name: "BuildRowSetFromXML"
  url: "/next/ampscript/functions/buildrowsetfromxml/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud-ampscript/references/mc-ampscript-content/mc-ampscript-reference-content-build-rowset-from-xml.html"
  tagline: "XML written as a string literal loses its tags when the Next email is saved"
  category: "Content"
  object: "Content"
  severity: "high"
  discrepancy: "A5"
  anchor: "buildrowsetfromxml-literal-tags-stripped"
  body: |
    The reference's examples write the XML document as a string literal inside the AMPscript block.

    In a Next email (2026-11-23) the save strips the tags out of such a literal: `BuildRowSetFromXML('<root><row>1</row><row>2</row></root>', "//row", 1)` was stored as `BuildRowSetFromXML('12', "//row", 1)`, so the function receives plain text instead of XML. The same document built with `Char(60)` for `<` and `Char(62)` for `>` (and `Char(34)` for quotes around attribute values) gives `2` rows.

    Build the markup with `Char()`, or take the XML from data so it is not part of the saved email.
  testScript: |
    %%[
      SET @xml = Concat(Char(60), "root", Char(62), Char(60), "row", Char(62), "1", Char(60), "/row", Char(62), Char(60), "row", Char(62), "2", Char(60), "/row", Char(62), Char(60), "/root", Char(62))
      SET @rows = BuildRowSetFromXML(@xml, "//row", 1)
    ]%%
    %%=RowCount(@rows)=%%

- name: "Char"
  url: "/next/ampscript/functions/char/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud-ampscript/references/mc-ampscript-string/mc-ampscript-reference-string-char.html"
  tagline: "The docs mark Char as unavailable in Next, but it renders there"
  category: "String"
  object: "String"
  severity: "medium"
  discrepancy: "A6"
  anchor: "char-available-in-next"
  body: |
    The availability table on the official Char page says the function is not available in Marketing Cloud Next. In a Next email preview it works: `Char(65)` gives `A`, `Char(65,3)` gives `AAA`, `Char("65")` gives `A`, and `Char(64)` gives `@`. Codes 0 to 255 each return one character (`Length(Char(190))` is `1`).

    Codes outside 0 to 255 (`Char(256)`, `Char(8364)`, `Char(-1)`) let the email save but make the preview fail with HTTP 500; that stays within the 0 to 255 range the page names.
  testScript: |
    %%=Char(65, 3)=%%

- name: "ContentBlockByID"
  url: "/next/ampscript/functions/contentblockbyid/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud-ampscript/references/mc-ampscript-content/mc-ampscript-reference-content-block-by-id.html"
  tagline: "A missing block breaks the render even with the error flag off, so the fallback and status code are never used"
  category: "Content"
  object: "Content"
  severity: "high"
  discrepancy: "A2"
  anchor: "contentblockbyid-missing-block-fails"
  body: |
    The reference says a falsy third argument suppresses the error for a block that cannot be found: the function then returns the fallback text from the fourth argument and sets the status variable to `-1`, and its status-code example builds on that.

    In a Next email (2026-11-22/23), `ContentBlockByID(999999999, "", 0, "FB-CBID", @sc)` for a block that does not exist saved and published, but the preview failed (HTTP 500). An email combining the flag spellings `false`, `"false"` and `"0"` also failed (not isolated per value), as did the flag `1`. The fallback text and the status code are never reached, so the documented fallback pattern does not protect the email. Loading a block that does exist was not tested.
  testScript: |
    %%[ SET @out = ContentBlockByID(999999999, "", 0, "FB-CBID", @sc) ]%%%%=v(@out)=%% %%=v(@sc)=%%

