    In a Next email (2026-11-23), `FormatDate("4 March 2026 1:52:07 PM", "yyyy-MM-dd", "HH:mm:ss")` rendered `4 March 2026 1:52:07 PM` unchanged: that spelled-out form with a time was not parsed. `not a date at all` and the number `20260304` were returned unchanged too, with no error. ISO and US slash dates (`2026-03-04`, `3/4/2026`, `03/04/2026 13:52:07`) format as expected.
  testScript: |
    %%=FormatDate("4 March 2026 1:52:07 PM", "yyyy-MM-dd", "HH:mm:ss")=%%

- name: "FormatDate"
  url: "/next/ampscript/functions/formatdate/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/marketing-cloud-ampscript/references/mc-ampscript-date-time/mc-ampscript-reference-date-time-format-date.html"
