- name: "{{format}}"
  url: "/next/handlebars/helpers/format/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/handlebars-for-marketing-cloud-next/references/mcn-handlebars-utility-references/mcn-handlebars-reference-utility-format.html"
  tagline: "The negative-number section of a format string is ignored"
  category: "Handlebars Utility"
  object: "Handlebars Utility"
  severity: "medium"
  discrepancy: "A7"
  anchor: "hb-format-negative-section-ignored"
  body: |
    The reference says a format string may be split by `;` into one section each for numbers above, below and equal to zero, and its own example formats `-1234.567` with `"N2;(F2);N0"` as `(1,234.57)`.

    In a Marketing Cloud Next email tested on 2026-11-22: `{{format -1234.567 "N2;(F2);N0"}}` rendered `-1,234.57`: the first section was used and the negative section ignored. The positive case, `{{format 1234.567 "N2;N0;N2"}}`, rendered `1,234.57` as documented.
  testScript: |
    {{format -1234.567 "N2;(F2);N0"}}

- name: "{{format}}"
  url: "/next/handlebars/helpers/format/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/handlebars-for-marketing-cloud-next/references/mcn-handlebars-utility-references/mcn-handlebars-reference-utility-format.html"
