  anchor: "hb-format-zero-padding-ignored"
  body: |
    The reference lists the custom format `000000` as padding `123` with leading zeros to `000123`.

    In a Marketing Cloud Next email tested on 2026-11-22: `{{format 123 "000000"}}` rendered `123`, without the leading zeros.
  testScript: |
    {{format 123 "000000"}}

- name: "{{filter}}"
  url: "/next/handlebars/helpers/filter/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/handlebars-for-marketing-cloud-next/references/mcn-handlebars-objects-references/mcn-handlebars-reference-objects-filter.html"
  tagline: "The documented call form breaks the email preview (HTTP 500)"
  category: "Handlebars Objects"
  object: "Handlebars Objects"
  severity: "high"
  discrepancy: "A5"
  anchor: "hb-filter-preview-http-500"
  body: |
    The reference shows `{{filter myList "age" ">" 25 "number"}}` returning the objects whose `age` is greater than 25.

    In a Marketing Cloud Next email tested on 2026-11-25: on a list of objects built with AMPscript `BuildRowsetFromJSON` (read in Handlebars as `rows`), `{{#each (filter rows "age" ">" 22 "number")}}[{{name}}]{{/each}}` let the email save, but the preview failed with HTTP 500 instead of rendering `[Bob][Cid]`. The same list renders with `each` and sorts correctly with `sort`.

    A list built with `jsonpath` from a JSON string fails the same way: `{{#each (filter (jsonpath '[{"name":"Bob","age":27},{"name":"Ann","age":21}]' "$") "age" ">" 22 "number")}}[{{name}}]{{/each}}` gives HTTP 500, and so do a string comparison and the documented chain inside `map`. No list source we tried made `filter` render.

    On 2026-11-26 the related DMO list of a data graph bound to the email failed too: `{{#each (filter (get (get @root "$dataGraph") "UnifiedLinkssotIndividualMkt__dlm") "ssot__DataSourceObjectId__c" "==" "Contact" "string")}}{{SourceRecordId__c}};{{/each}}` saved, but the Email Builder preview showed an error for the whole email, while `each`, `sort` and `slice` read the same list. Without `filterAs` (which the reference marks as required) the save itself was rejected with HTTP 400. A row test inside the loop works instead: `{{#if (compare ssot__DataSourceObjectId__c "==" "Contact")}}`. See [Related DMO rows](/next/querying-data/#related-dmo-rows-of-the-graph).
  testScript: |
    %%[ SET @rows = BuildRowsetFromJSON('[{"name":"Bob","age":27},{"name":"Ann","age":21},{"name":"Cid","age":24}]', '$[*]', 1) ]%%{{#each (filter rows "age" ">" 22 "number")}}[{{name}}]{{/each}}

- name: "{{formatCurrency}}"
  url: "/next/handlebars/helpers/formatcurrency/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/handlebars-for-marketing-cloud-next/references/mcn-handlebars-utility-references/mcn-handlebars-reference-utility-formatcurrency.html"
  tagline: "de-DE puts a non-breaking space before the euro sign"
  category: "Handlebars Utility"
  object: "Handlebars Utility"
  severity: "low"
  discrepancy: "A7"
  anchor: "hb-formatcurrency-de-nbsp"
  body: |
    The reference shows the `de-DE` result as `1.234,56 €` with an ordinary space before the euro sign.

    In a Marketing Cloud Next email tested on 2026-11-22: `{{formatCurrency 1234.56 "de-DE"}}` rendered `1.234,56 €` with a non-breaking space (U+00A0) before `€`. It looks identical, but a plain text comparison against the documented value fails. `en-US` and `ja-JP` matched the docs.
  testScript: |
    {{formatCurrency 1234.56 "de-DE"}}

- name: "{{lookup}}"
  url: "/next/handlebars/helpers/lookup/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/handlebars-for-marketing-cloud-next/references/mcn-handlebars-objects-references/mcn-handlebars-reference-objects-lookup.html"
  tagline: "A missing key renders the whole object instead of nothing"
  category: "Handlebars Objects"
  object: "Handlebars Objects"
  severity: "medium"
  discrepancy: "A2"
  anchor: "hb-lookup-missing-key-renders-object"
  body: |
    The reference says that a key which does not exist gives `undefined`, which renders as an empty string.

    In a Marketing Cloud Next email tested on 2026-11-22: `{{lookup (hash k="v") "missing"}}` rendered `{k=v}`, the whole object, instead of an empty string. An existing key, `{{lookup (hash k="v") "k"}}`, rendered `v`.
  testScript: |
    {{lookup (hash k="v") "missing"}}

- name: "{{propercase}}"
  url: "/next/handlebars/helpers/propercase/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/handlebars-for-marketing-cloud-next/references/mcn-handlebars-string-references/mcn-handlebars-reference-string-propercase.html"
  tagline: "The spaces between the words disappear"
  category: "Handlebars String"
  object: "Handlebars String"
  severity: "medium"
  discrepancy: "A7"
  anchor: "hb-propercase-drops-spaces"
  body: |
    The reference says the helper capitalizes the first letter of each word and lowercases the rest. It says nothing about removing spaces.

    In a Marketing Cloud Next email tested on 2026-11-25: `{{propercase "hELLO wORLD"}}` rendered `HelloWorld` instead of `Hello World`; the space between the words was dropped.
  testScript: |
    {{propercase "hELLO wORLD"}}

- name: "{{replace}}"
  url: "/next/handlebars/helpers/replace/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/handlebars-for-marketing-cloud-next/references/mcn-handlebars-string-references/mcn-handlebars-reference-string-replace.html"
  tagline: "The search ignores case although the docs call it case-sensitive"
  category: "Handlebars String"
  object: "Handlebars String"
  severity: "medium"
  discrepancy: "A7"
  anchor: "hb-replace-ignores-case"
  body: |
    The reference says the search string is matched case-sensitively.

    In a Marketing Cloud Next email tested on 2026-11-22: `{{replace "Aa" "a" "x"}}` rendered `xx`: the uppercase `A` was replaced too. A case-sensitive match would give `Ax`.
  testScript: |
    {{replace "Aa" "a" "x"}}

- name: "{{substring}}"
  url: "/next/handlebars/helpers/substring/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/handlebars-for-marketing-cloud-next/references/mcn-handlebars-string-references/mcn-handlebars-reference-string-substring.html"
  tagline: "With triple braces it renders an internal Java object name"
  category: "Handlebars String"
  object: "Handlebars String"
  severity: "medium"
  discrepancy: "A5"
  anchor: "hb-substring-triple-brace-object-name"
  body: |
    The reference does not say that the helper cannot be used with triple braces, the usual Handlebars way to output a value without HTML escaping.

    In a Marketing Cloud Next email tested on 2026-11-22: `{{{substring "<i>abc</i>" 1 6}}}` rendered `com.salesforce.e360.messaging.rendering.helper.HandlebarResultWrapper@539b5bf2` instead of the text. With double braces the helper works: `{{substring "abcdef" 2 3}}` rendered `bcd`.
  testScript: |
    {{{substring "<i>abc</i>" 1 6}}}

- name: "{{subtract}}"
  url: "/next/handlebars/helpers/subtract/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/handlebars-for-marketing-cloud-next/references/mcn-handlebars-math-references/mcn-handlebars-reference-math-subtract.html"
  tagline: "Decimal values break the email preview (HTTP 500)"
  category: "Handlebars Math"
  object: "Handlebars Math"
  severity: "high"
  discrepancy: "A7"
  anchor: "hb-subtract-decimals-http-500"
  body: |
    The reference says `subtract` handles decimals as well as whole numbers and rounds the difference to two decimal places.

    In a Marketing Cloud Next email tested on 2026-11-22: `{{subtract 1.5 2.25}}` let the email save and publish, but the preview then failed with HTTP 500 and no message instead of rendering `-0.75`. Whole numbers work: `{{subtract 5 3}}` rendered `2`.
  testScript: |
    {{subtract 1.5 2.25}}

- name: "{{uppercase}}"
  url: "/next/handlebars/helpers/uppercase/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/handlebars-for-marketing-cloud-next/references/mcn-handlebars-string-references/mcn-handlebars-reference-string-uppercase.html"
  tagline: "With triple braces it renders an internal Java object name"
  category: "Handlebars String"
  object: "Handlebars String"
  severity: "medium"
  discrepancy: "A5"
  anchor: "hb-uppercase-triple-brace-object-name"
  body: |
    The reference does not say that the helper cannot be used with triple braces, the usual Handlebars way to output a value without HTML escaping.

    In a Marketing Cloud Next email tested on 2026-11-22: `{{{uppercase "<i>a</i>"}}}` rendered `com.salesforce.e360.messaging.rendering.helper.HandlebarResultWrapper@451c8ea0` instead of the text. With double braces the helper works: `{{uppercase "mcn"}}` rendered `MCN`.
  testScript: |
    {{{uppercase "<i>a</i>"}}}

- name: "{{impressionRegion}}"
  url: "/next/handlebars/helpers/impressionregion/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/handlebars-for-marketing-cloud-next/references/mcn-handlebars-content-references/mcn-handlebars-reference-content-impressionregion.html"
  tagline: "The documented name= form is rejected; the region name must be positional"
  category: "Handlebars Content"
  object: "Handlebars Content"
  severity: "high"
  discrepancy: "A3"
  anchor: "hb-impressionregion-positional-name"
  body: |
    The reference passes the region name as a hash argument: `{{#impressionRegion name="…"}}`.

    In Marketing Cloud Next emails tested on 2026-11-25: that form could not be saved; the CMS answered that the helper requires a positional argument, not hash syntax. `{{#impressionRegion "Banner"}}in{{/impressionRegion}}` rendered `in`.
  testScript: |
    {{#impressionRegion name="Banner"}}in{{/impressionRegion}}

- name: "{{query}}"
  url: "/next/handlebars/helpers/query/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/handlebars-for-marketing-cloud-next/references/mcn-handlebars-data-references/mcn-handlebars-reference-data-query.html"
  tagline: "On a marketing object it needs an inline filter, or the preview fails with HTTP 500"
  category: "Handlebars Data"
  object: "Handlebars Data"
  severity: "high"
  discrepancy: "A3"
  anchor: "hb-query-mo-needs-key-filter"
  body: |
    The reference lists only `object` and `type` as required for `query`; filtering by `where`/`params`, `id` or inline field conditions is described as optional.

    In Marketing Cloud Next emails tested on 2026-11-25, one call per email: on a marketing object (`type="MO"`) the call rendered only when an inline filter was given. Without that filter the preview failed with HTTP 500 and no message. A `where` filter with `params` on the key field, such as `where="CouponCode__c = :c" params=(hash c="PROBE0001")`, failed the same way, with `=` and with `LIKE`.

    Tests on 2026-11-26 with a second marketing object (number key `CouponNo__c`) showed that the inline filter may name any field (number, text or boolean, numbers with or without quotes) and that several filters combine with AND. `limit` works; `sortBy` fails with HTTP 500. A filter that matched two records returned only one of them.

    `{{#each (query type="MO" object="zzprobecoupons__mo" CouponCode__c="PROBE0001")}}{{CouponCode__c}};{{/each}}` rendered `PROBE0001;`.
  testScript: |
    {{#each (query object="zzprobecoupons__mo" type="MO" fields="CouponCode__c")}}{{CouponCode__c}};{{/each}}

- name: "{{query}}"
  url: "/next/handlebars/helpers/query/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/handlebars-for-marketing-cloud-next/references/mcn-handlebars-data-references/mcn-handlebars-reference-data-query.html"
  tagline: "A value written straight into where fails the preview with HTTP 500"
  category: "Handlebars Data"
  object: "Handlebars Data"
  severity: "high"
  discrepancy: "A7"
  anchor: "hb-query-where-literal-fails"
  body: |
    The reference describes `where` with `:paramName` placeholders, and its grouping example writes the compared values straight into the filter.

    In Marketing Cloud Next emails tested on 2026-11-25, one call per email, on the `Contact` object: `where="LastName = 'Blau'"` (a quoted string), `where="pi__score__c = 82"` (a number) and a filter mixing a quoted string with a placeholder all saved, but failed the preview with HTTP 500. The same filters with every value passed through `params=(hash …)` rendered the expected records.
  testScript: |
    {{#each (query type="CRM" object="Contact" fields="LastName" where="LastName = 'Blau'")}}{{LastName}};{{/each}}

- name: "{{query}}"
  url: "/next/handlebars/helpers/query/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/handlebars-for-marketing-cloud-next/references/mcn-handlebars-data-references/mcn-handlebars-reference-data-query.html"
  tagline: "LIKE matches anywhere in the field and ignores the % wildcard"
  category: "Handlebars Data"
  object: "Handlebars Data"
  severity: "medium"
  discrepancy: "A7"
  anchor: "hb-query-like-contains"
  body: |
    The reference lists `LIKE` among the `where` operators and shows it with a placeholder, without saying how it matches.

    In Marketing Cloud Next emails tested on 2026-11-25 on the `Contact` object, compared with SOQL on the same org: `where="LastName LIKE :n"` matched the value anywhere in the field, regardless of case, and did not treat `%` as a wildcard. `n="Ro%"` returned `Brown`, `Frost`, `Rogers`, `Rose` and `Rossi`, where a SOQL prefix match returns only the last three; `n="%son"` also returned `Song`; `n="Bl"` returned `Blay` and `Blau`, where SOQL returns none.
  testScript: |
    {{#each (query type="CRM" object="Contact" fields="LastName,pi__score__c" where="LastName LIKE :n" params=(hash n="Ro%") sortBy="LastName ASC")}}{{LastName}};{{/each}}

- name: "{{query}}"
  url: "/next/handlebars/helpers/query/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/handlebars-for-marketing-cloud-next/references/mcn-handlebars-data-references/mcn-handlebars-reference-data-query.html"
  tagline: "Without fields, every field of the result renders empty"
  category: "Handlebars Data"
  object: "Handlebars Data"
  severity: "medium"
  discrepancy: "A3"
  anchor: "hb-query-no-fields-empty"
  body: |
    The reference marks `fields` as optional, and its examples call `query` without it.

    In a Marketing Cloud Next email tested on 2026-11-25 on the `Contact` object: `{{#each (query type="CRM" object="Contact" where="pi__score__c = :s" params=(hash s=82))}}{{LastName}}.{{FirstName}}.{{pi__score__c}};{{/each}}` rendered `..;` — one matching record, with every field empty. With `fields="LastName"` the same call rendered the last name, and only the listed fields were filled.
  testScript: |
    {{#each (query type="CRM" object="Contact" where="pi__score__c = :s" params=(hash s=82))}}{{LastName}}.{{FirstName}}.{{pi__score__c}};{{/each}}

- name: "{{queryFirst}}"
  url: "/next/handlebars/helpers/queryfirst/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/handlebars-for-marketing-cloud-next/references/mcn-handlebars-data-references/mcn-handlebars-reference-data-queryfirst.html"
  tagline: "On a marketing object it needs an inline filter, or the preview fails with HTTP 500"
  category: "Handlebars Data"
  object: "Handlebars Data"
  severity: "high"
  discrepancy: "A3"
  anchor: "hb-queryfirst-mo-needs-key-filter"
  body: |
    The reference lists only `object` and `type` as required for `queryFirst`; filtering by `where`/`params`, `id` or inline field conditions is described as optional.

    In Marketing Cloud Next emails tested on 2026-11-25, one call per email: on a marketing object (`type="MO"`) the call rendered only when an inline filter was given. Without that filter the preview failed with HTTP 500 and no message. On 2026-11-26 a filter on a field other than the key worked as well, while `sortBy` failed with HTTP 500.

    `{{get (queryFirst type="MO" object="zzprobecoupons__mo" CouponCode__c="PROBE0001") "IsClaimed__c"}}` rendered `false`.
  testScript: |
    {{get (queryFirst object="zzprobecoupons__mo" type="MO") "CouponCode__c"}}

- name: "{{queryFirst}}"
  url: "/next/handlebars/helpers/queryfirst/"
  officialUrl: "https://developer.salesforce.com/docs/marketing/handlebars-for-marketing-cloud-next/references/mcn-handlebars-data-references/mcn-handlebars-reference-data-queryfirst.html"
  tagline: "With type DG it fails with HTTP 500 in every form tested"
  category: "Handlebars Data"
  object: "Handlebars Data"
  severity: "high"
  discrepancy: "A6"
  anchor: "hb-queryfirst-dg-fails"
  body: |
    The reference lists `DG` as a valid `type` for `queryFirst`: `object` names a data graph, and its example picks a unified profile through a contact-point email filter.

    In Marketing Cloud Next emails tested on 2026-11-26, one call per email, no `type="DG"` call rendered. Every form saved and published, but the preview failed with HTTP 500 (the Email Builder preview showed a generic error instead): an inline filter on the key of the graph's root object with a unified individual id or with a source Individual id, the documented `contactPointEmail="<email>"` filter, no filter, and `where` with `params`. The email was bound to the same data graph in the same data space (`default`), and the ids were checked against the graph's data beforehand.

    The data graph bound to the email can be read instead: in the Email Builder preview with a profile, `{{get (get @root "$dataGraph") "ssot__FirstName__c"}}` rendered the recipient's first name. Its related DMO lists can be looped with `#each`, filtered with `#if` and `compare`, sorted with `sort` and cut with `slice`. See [Data graphs](/next/querying-data/#data-graphs).
  testScript: |
    {{get (queryFirst type="DG" object="Marketing" contactPointEmail="<email address>") "ssot__FirstName__c"}}
