  anchor: "contentblockbykey-missing-block-fails"
  body: |
    The reference says a falsy third argument suppresses the error for a block that cannot be found: the function then returns the fallback text from the fourth argument and sets the status variable to `-1`, and its status-code example builds on that.

    In a Next email (2026-11-22/23), `ContentBlockByKey("nosuch-key", "", 0, "FB-CBK", @sc)` for a block that does not exist saved and published, but the preview failed (HTTP 500). An email combining the flag spellings `false`, `"false"` and `"0"` also failed (not isolated per value), as did the flag `1`. The fallback text and the status code are never reached, so the documented fallback pattern does not protect the email. Loading a block that does exist was not tested.
  testScript: |
    %%[ SET @out = ContentBlockByKey("nosuch-key", "", 0, "FB-CBK", @sc) ]%%%%=v(@out)=%% %%=v(@sc)=%%

