# Test scripts for /engagement/ampscript/functions/contentareabyname/.
#
# Rendered by _includes/test-script.html. The script is a full AMPscript
# block that can be pasted into a CloudPage and deployed as-is.
#
# AMPscript has no try/catch, so a rejected argument aborts the whole page
# with HTTP 422 and discards everything rendered before it. The missing/
# default cases below are accepted and share one request. Branch: ?b=safe.
# A branch that renders nothing at all is the failure signal.
#
# ContentAreaByName references retired Classic content areas, so this bundle
# exercises the no-match / default-content contract rather than a found
# render. The default-content path is what proves the function is still live.
#
# Scope: proven on a plain CloudPage GET on the child QA business unit only.
behaviour: |
  %%[
    VAR @b, @sc, @miss, @lit
    SET @b = RequestParameter("b")

    /* safe sweep: the missing/default paths are accepted and share one request */
    IF @b == "safe" THEN
      /* missing with error flag 0: returns the default content and sets status to -1 */
      SET @miss = ContentAreaByName("nosuch\Folder\Area", "", 0, "FB-CAN", @sc)
      OutputLine(Concat("miss=[", @miss, "] sc=[", @sc, "]"))

      /* default content is emitted literally - the inline AMPscript is NOT evaluated */
      SET @lit = ContentAreaByName("nosuch\Folder\Area", "", 0, "PRE-%%=Add(2,3)=%%-POST", @sc)
      OutputLine(Concat("lit=[", @lit, "]"))
    ENDIF
  ]%%
