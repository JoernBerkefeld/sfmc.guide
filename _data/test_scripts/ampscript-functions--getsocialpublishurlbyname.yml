# Test scripts for /engagement/ampscript/functions/getsocialpublishurlbyname/.
#
# Rendered by _includes/test-script.html. The script is a full AMPscript
# block that can be pasted into a CloudPage and deployed as-is.
#
# AMPscript has no try/catch, so a rejected argument aborts the whole page
# with HTTP 422 and discards everything rendered before it. Risky cases
# therefore sit behind their own RequestParameter("b") branch and must be
# fetched one at a time. Branches on this page: ?b=safe, ?b=param, ?b=empty, ?b=bad.
# A branch that renders nothing at all is the failure signal.
behaviour: |
  %%[
    VAR @b
    SET @b = RequestParameter("b")

    /* safe call: returns a Social Forward publish URL */
    IF @b == "safe" THEN
      OutputLine(Concat("GetSocialPublishURLByName(Facebook,US,region)=[", GetSocialPublishURLByName("Facebook", "US", "Shared content region 1"), "]"))
    ENDIF

    /* an appended key/value pair is accepted (variadic) */
    IF @b == "param" THEN
      OutputLine(Concat("GetSocialPublishURLByName(...,k,v)=[", GetSocialPublishURLByName("Facebook", "US", "Shared content region 1", "utm_source", "amp"), "]"))
    ENDIF

    /* an empty content region aborts the page: the start marker never renders */
    IF @b == "empty" THEN
      OutputLine(Concat("empty start"))
      OutputLine(Concat("GetSocialPublishURLByName(Facebook,US,'')=[", GetSocialPublishURLByName("Facebook", "US", ""), "]"))
      OutputLine(Concat("empty done"))
    ENDIF

    /* an unknown network name aborts the page too */
    IF @b == "bad" THEN
      OutputLine(Concat("bad start"))
      OutputLine(Concat("GetSocialPublishURLByName(bad,US,region)=[", GetSocialPublishURLByName("NotARealNetwork", "US", "Shared content region 1"), "]"))
      OutputLine(Concat("bad done"))
    ENDIF
  ]%%
